name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe your use case, and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea for a solution
      description: Optional.
