# Publishes one verified package to the VS Code Marketplace and Open VSX.
# - Automatically when a version tag (for example 0.11.2) is pushed.
# - Manually from the Actions tab ("Run workflow"), which publishes the
#   version currently in package.json on the selected branch.
#   With "dry_run", it only builds and verifies the package and checks the
#   Open VSX token. With "pre_release", the package is marked as a pre-release:
#   both registries offer it only to users who switch to pre-release versions.
#   A pushed tag always publishes a release version.
# If one registry fails, use "Re-run failed jobs": it publishes the same package
# to that registry only. --skip-duplicate also keeps a full re-run from failing
# on a registry that already has this version.
# Marketplace authentication uses Trusted Publishing (OIDC): no token is stored.
# It requires a Trusted Publishing policy for this repository and this workflow
# file (publish.yml) on the publisher's management page.
# Open VSX authentication uses the OVSX_PAT repository secret.
# Every publication waits for an approval in the protected "release" environment:
# the build job uses it, and both publishing jobs depend on the build job.
# That environment only accepts main and version tags. A dry run publishes
# nothing and uses the unprotected "dry-run" environment, from any branch.
# The publishing jobs themselves use no environment, so the Marketplace
# Trusted Publishing policy (no environment) still matches.
# Once both registries have the package, a GitHub release is created with the
# .vsix and the notes of this version from the CHANGELOG. It creates the tag of
# a manual run; a tag created with the workflow's token starts no other run.

name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the package without publishing
        type: boolean
        default: false
      pre_release:
        description: Publish as a pre-release (users opt in from the Extensions view)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.dry_run && 'dry-run' || 'release' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Accessibility audit of the themes
        run: npm run themes:audit

      - name: Generated themes match the palettes
        run: npm run themes:check

      - name: Months look different from one another
        run: npm run themes:variety

      - name: Measuring tools match published reference data
        run: npm run themes:test

      - name: Lint and tests
        run: xvfb-run -a npm test

      - name: Check the release notes
        run: node scripts/release-notes.cjs "$(node -p "require('./package.json').version")" > /dev/null

      - name: Build the package
        run: npm run package -- --githubBranch main --out extension.vsix ${{ inputs.pre_release && '--pre-release' || '' }}

      - name: Verify the package
        env:
          PRE_RELEASE: ${{ inputs.pre_release && 'true' || 'false' }}
        run: |
          unzip -q extension.vsix -d "$RUNNER_TEMP/vsix"
          node scripts/verify-package.cjs "$RUNNER_TEMP/vsix"
          sha256sum extension.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: extension.vsix
          if-no-files-found: error

  marketplace:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish to the Marketplace
        run: npm run publish -- --packagePath extension.vsix --oidc --skip-duplicate

  open-vsx:
    needs: build
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Check the Open VSX token
        run: npx --yes ovsx@1.3.0 verify-pat mickaellherminez

      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run }}
        run: npx --yes ovsx@1.3.0 publish extension.vsix --skip-duplicate

  github-release:
    needs: [marketplace, open-vsx]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE_FLAG: ${{ inputs.pre_release && '--prerelease' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Create the GitHub release
        run: |
          version=$(node -p "require('./package.json').version")
          asset="365-daynight-vscode-theme-ext-$version.vsix"
          mv extension.vsix "$asset"
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" "$asset" --clobber
          else
            node scripts/release-notes.cjs "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$version" "$asset" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE_FLAG
          fi
